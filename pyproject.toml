[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simpleaudit-studio"
version = "0.5.6"
description = "Production AI model audit platform — one-liner demo mode via uvx"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Django==5.2.4",
    "djangorestframework==3.16.0",
    "drf-spectacular==0.28.0",
    "python-dotenv==1.1.1",
    "requests==2.32.5",
    "httpx>=0.27",
    "hatchet-sdk==1.41.0",
    "pydantic>=2.7,<3",
    "sentry-sdk[django]>=2.0",
    "workos==10.4.0",
    # PyPI release (not a git ref): PyPI forbids direct URL dependencies in
    # package metadata, so the engine must be a registry dependency. 0.2.0 is
    # the first release containing run_scenario_reps (n_repetitions support);
    # 0.2.1 adds the native on_turn per-phase progress callback; 0.3.1 adds
    # the traceparent-to-wire forwarding this repo's tracing relies on.
    "simpleaudit==0.3.1",
    "cronsim==2.7",
    "psutil>=7.2.2",
    "opentelemetry-proto>=1.45.0",
    "caddyserver>=2.11.7",
]

# package = false: Studio is run, not installed as a wheel (hatchling rejects
# direct-reference dependencies otherwise).
[tool.uv]
package = false

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.2.13"]
server = ["gunicorn==23.0.0"]
dev = [
    "factory_boy==3.3.2",
    "ruff",
    # Test runner stack. xdist is pinned <3.8 because 3.8+ pulls in `greenlet`,
    # which does not build on Python 3.11 (the project's lower bound).
    "pytest>=8,<9",
    "pytest-django>=4.8,<5",
    "pytest-xdist>=3.6,<3.8",
    "pytest-testmon>=2,<3",
    "pytest-env>=1,<2",
]
e2e = ["playwright>=1.45"]

[project.scripts]
simpleaudit-studio = "simpleaudit_studio.cli:main"
spin = "simpleaudit_studio.cli:main"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = [
    # Django model Meta classes, admin ModelAdmins, factory-boy factories, and
    # migrations all require mutable class attributes (ordering, constraints,
    # list_display, field defaults). RUF012 is a false positive for these
    # idioms; the values are never mutated at runtime.
    "RUF012",
]

[tool.hatch.build.targets.wheel]
packages = [
    "simpleaudit_studio",
    "config",
    "accounts",
    "audits",
    "chat",
    "infra",
    "integrations",
    "scenarios",
    "model_registry",
    "judges",
    "deploy",
    "templates",
    "static",
]
