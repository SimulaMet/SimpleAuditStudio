name: Upload Python Package to PyPI when a Release is Created

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Publish release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/simpleaudit-studio/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Test before publishing
        env:
          DJANGO_SECRET_KEY: ci-secret-key
          SIMPLEAUDIT_LOCAL_SQLITE: "1"
        run: |
          uv sync --frozen --extra dev
          uv run ruff check .
          uv run python manage.py test infra --parallel auto --exclude-tag embedded_hatchet
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: |
          python -m build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
