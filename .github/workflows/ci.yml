name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra postgres
      - name: Lint (ruff)
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: simpleaudit_test
          POSTGRES_USER: simpleaudit
          POSTGRES_PASSWORD: simpleaudit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simpleaudit -d simpleaudit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_DB: simpleaudit_test
      POSTGRES_USER: simpleaudit
      POSTGRES_PASSWORD: simpleaudit
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra postgres
      - name: Run tests (parallel)
        run: uv run python manage.py test infra --parallel auto --exclude-tag embedded_hatchet
      - name: Check if embedded Hatchet files changed
        id: hatchet-changed
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- infra/minimal_config.py infra/worker.py 2>/dev/null || true)
          if [ -n "$CHANGED" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - name: Run tests (embedded Hatchet, serial)
        if: steps.hatchet-changed.outputs.changed == 'true'
        run: uv run python manage.py test infra.tests.test_minimal_config.TestEmbeddedHatchetLifecycle
