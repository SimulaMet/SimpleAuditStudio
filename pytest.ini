[pytest]
; Parsed before conftest.py, so these reach Django settings on import.
; Mirrors the env block in .github/workflows/ci.yml.
DJANGO_SETTINGS_MODULE = config.settings
; e2e/test_ui.py is a standalone Playwright script (not a pytest test) that
; sys.exit()s at import, so it must not be collected.
norecursedirs = e2e node_modules .venv static staticfiles
; SIMPLEAUDIT_CHAT=off: chat stays off whatever the shell exports (a sourced
; dev .env sets it); chat tests turn it on with mock.patch("chat.config.ENABLED").
; conftest.py also refuses any connection to a live Open WebUI.
env =
    SIMPLEAUDIT_LOCAL_SQLITE=1
    DJANGO_SECRET_KEY=test-secret-key-not-change-me
    DJANGO_DEBUG=false
    DJANGO_ALLOWED_HOSTS=*
    SIMPLEAUDIT_CHAT=off
; Django @tag("...") values are mirrored onto pytest items by conftest.py, so
; -m selection works the same as manage.py test --exclude-tag.
markers =
    slow: heavy integration tests (engine, full API lifecycle, monitors, judges, experiments)
    embedded_hatchet: starts a real embedded Hatchet worker; run serially, not in parallel
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
