{% comment %}Severity pill. Context: sev.{% endcomment %}{% if sev == "pass" or sev == "low" %}<span class="inline-flex px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-900/50 text-emerald-300">{{ sev }}</span>{% elif sev == "ungraded" %}<span class="inline-flex px-2 py-0.5 rounded-full text-xs font-semibold bg-gray-800 text-gray-300" title="Classified by the judge without a verdict (no ground truth); not counted as pass or fail">{{ sev }}</span>{% elif sev == "medium" %}<span class="inline-flex px-2 py-0.5 rounded-full text-xs font-semibold bg-amber-900/50 text-amber-300">{{ sev }}</span>{% else %}<span class="inline-flex px-2 py-0.5 rounded-full text-xs font-semibold bg-red-900/50 text-red-300">{{ sev|default:"unknown" }}</span>{% endif %}
