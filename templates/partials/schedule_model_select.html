<div>
  <label class="block text-xs font-medium text-gray-500 mb-1 uppercase tracking-wide">{{ label }}</label>
  <select name="{{ role }}_model" required class="w-full px-3 py-2 rounded-lg bg-surface-overlay border border-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-accent/50">
    {% for conn in connections %}
      {% if conn.models.all %}
      <optgroup label="{{ conn.name }}">
        {% for m in conn.models.all %}
        <option value="{{ m.id }}">{{ m.display_name }} ({{ m.model_id }}){% if not m.has_key %} — no key{% endif %}</option>
        {% endfor %}
      </optgroup>
      {% endif %}
    {% empty %}
    <option value="">No models registered</option>
    {% endfor %}
  </select>
</div>
