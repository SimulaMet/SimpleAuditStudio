{% comment %}Role badge for a failed scenario. Context: failure, label, where (model or endpoint, optional).{% endcomment %}<span data-testid="failure-badge" data-role="{{ failure.role }}" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold {% if failure.role == 'target' %}bg-orange-900/50 text-orange-300{% elif failure.role == 'auditor' %}bg-sky-900/50 text-sky-300{% elif failure.role == 'judge' %}bg-violet-900/50 text-violet-300{% else %}bg-gray-800 text-gray-300{% endif %}"{% if where %} title="{{ where }}"{% endif %}>{{ label }}{% if failure.http_status %} <span class="font-normal opacity-80">{{ failure.http_status }}</span>{% endif %}</span>
