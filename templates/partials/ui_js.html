<script>
// Shared page helpers, loaded in <head> so every page script can use them.
window.esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
window.csrfToken = () => (document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/) || [])[1] || '';
// JSON request with CSRF. Resolves to the parsed body; throws Error(message) on HTTP or network failure.
window.apiFetch = async (url, { method = 'POST', body } = {}) => {
  const resp = await fetch(url, {
    method, credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken() },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data?.error?.message || data?.error || data?.detail || `Request failed (${resp.status})`);
  return data;
};
// <form data-confirm="Delete this?"> asks before submitting.
document.addEventListener('submit', e => {
  const msg = e.target.dataset && e.target.dataset.confirm;
  if (msg && !confirm(msg)) e.preventDefault();
}, true);
// <form data-membership-form> adds/removes experiment runs. An optional
// [data-experiment-select] picks the target URL; a public experiment
// (option or form data-public="1") needs an explicit confirmation, which the
// server also requires (confirm_public=1).
document.addEventListener('submit', e => {
  const form = e.target;
  if (!form.matches || !form.matches('[data-membership-form]')) return;
  const sel = form.querySelector('[data-experiment-select]');
  const opt = sel && sel.selectedOptions[0];
  if (opt) form.action = opt.value;
  const isPublic = (opt ? opt.dataset.public : form.dataset.public) === '1';
  if (![...form.elements].some(el => el.name === 'run_ids' && (el.type === 'hidden' || el.checked))) {
    e.preventDefault(); alert('Select at least one run.'); return;
  }
  const field = form.querySelector('input[name="confirm_public"]');
  if (isPublic) {
    const removing = form.dataset.action === 'remove';
    const msg = removing
      ? 'This experiment is public. Remove the selected runs from it? They stay public if another public experiment includes them.'
      : 'This experiment is public. Adding runs publishes them — transcripts and results included — to anyone with the URL. Continue?';
    if (!confirm(msg)) { e.preventDefault(); return; }
    if (field) field.value = '1';
  }
}, true);
// <details data-popover> behaves like a popover: one open at a time, closed
// by a click outside or Esc (focus returns to its summary). Esc inside a
// search field first clears the text, as browsers do for type=search.
(() => {
  const open = () => [...document.querySelectorAll('details[data-popover][open]')];
  document.addEventListener('click', e => {
    // composedPath: a click handler may already have removed the target
    // (e.g. a chip's × button), which must not count as "outside".
    const path = e.composedPath();
    for (const d of open()) if (!path.includes(d)) d.open = false;
  });
  document.addEventListener('toggle', e => {
    const d = e.target;
    if (d.matches && d.matches('details[data-popover]') && d.open) {
      for (const other of open()) if (other !== d) other.open = false;
    }
  }, true);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    const t = e.target;
    if (t.matches && t.matches('input[type="search"]') && t.value) return;
    const d = open().pop();
    if (!d) return;
    e.preventDefault();
    d.open = false;
    d.querySelector('summary')?.focus();
  });
})();
// Clickable rows/cards: <tr|section data-href="/x/"> opens its detail page on click or Enter,
// unless the click lands on a nested control. Ctrl/Cmd/middle-click opens a new tab.
(() => {
  const nested = 'a, button, input, select, textarea, label, summary, form, [role="button"]';
  const target = e => { const el = e.target.closest('[data-href]'); const inner = e.target.closest(nested); return el && !(inner && el.contains(inner) && inner !== el) ? el : null; };
  const go = (el, newTab) => newTab ? window.open(el.dataset.href, '_blank', 'noopener') : (window.location.href = el.dataset.href);
  document.addEventListener('click', e => { const el = target(e); if (el && !window.getSelection().toString()) go(el, e.metaKey || e.ctrlKey); });
  document.addEventListener('auxclick', e => { const el = e.button === 1 && target(e); if (el) go(el, true); });
  document.addEventListener('keydown', e => {
    const t = e.target;
    if (t.matches && t.matches('[data-href]') && e.key === 'Enter') go(t, e.metaKey || e.ctrlKey);
    else if (t.matches && t.matches('[role="button"][onclick]:not(button)') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); t.click(); }
  });
  // Accessibility fallbacks for markup that predates these conventions: placeholder-only fields
  // get an accessible name, and clickable non-interactive elements become focusable buttons.
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('tr[data-href]:not([tabindex])').forEach(r => r.tabIndex = 0);
    document.querySelectorAll('input:not([type=hidden]):not([type=checkbox]):not([type=radio]), textarea, select').forEach(f => {
      if (f.labels && f.labels.length || f.hasAttribute('aria-label') || f.hasAttribute('aria-labelledby')) return;
      const name = f.getAttribute('placeholder') || f.getAttribute('title') || f.name || (f.tagName === 'SELECT' ? f.options[0]?.text.trim() : f.type === 'file' ? 'Choose file' : '');
      if (name) f.setAttribute('aria-label', name.replace(/[_-]+/g, ' '));
    });
    document.querySelectorAll('div[onclick]:not([role]):not([tabindex]):not(.fixed)').forEach(el => {
      if (!/stopPropagation/.test(el.getAttribute('onclick'))) { el.setAttribute('role', 'button'); el.tabIndex = 0; }
    });
  });
})();
</script>
