{% load json_filters %}
<!--
  Agentic controls (authoring form): Rules first, then Enforcement, which holds the
  semantic judge switch and its criteria. Criteria come from the judge's canonical
  dimensions, so the placeholder and hover text always match what the judge accepts.
-->
<fieldset class="rounded-lg border border-gray-700 bg-surface-raised/40 p-3 space-y-3" data-agentic-controls>
  <legend class="text-xs font-medium text-gray-300 mb-1">Agentic checks</legend>

  {% include "partials/agentic_rules_editor.html" with agentic=agentic %}

  {% with dims=""|judge_dimensions %}
  <div data-active-section="enforcement" class="space-y-2">
    <p class="text-xs font-semibold text-gray-400">Enforcement</p>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-1">
      <div>
        <label class="block text-[11px] text-gray-500 mb-1">Mode</label>
        <select class="w-full px-2 py-1.5 rounded bg-surface-overlay border border-gray-700 text-xs focus:outline-none focus:ring-1 focus:ring-accent/50" name="agentic_enforcement_mode" title="How violations are treated. Advisory = record findings but let the run finish; Gating = fail the run when a check is violated. 'Keep' leaves the existing mode unchanged.">
          <option value="">Keep enforcement mode</option>
          <option value="advisory" {% if agentic.enforcement.mode == 'advisory' %}selected{% endif %}>Advisory</option>
          <option value="gating" {% if agentic.enforcement.mode == 'gating' %}selected{% endif %}>Gating</option>
        </select>
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-1">
      <p class="text-[11px] text-gray-500">Semantic judge</p>
      <p class="text-[11px] text-gray-500">Criteria</p>
      <label class="flex items-center gap-2 h-8 text-xs text-gray-300 cursor-pointer select-none" title="Enable the LLM semantic judge for this scenario. Disable to rely on deterministic checks only.">
        <input type="hidden" name="agentic_semantic_judge_enabled" value="0">
        <input type="checkbox" class="h-3.5 w-3.5 shrink-0 rounded border-gray-600 bg-surface-overlay accent-accent" name="agentic_semantic_judge_enabled" value="1" {% if agentic.semantic_judge.enabled %}checked{% endif %}>
        Enable semantic judge
      </label>
      <input class="w-full h-8 px-2 rounded bg-surface-overlay border border-gray-700 text-xs text-gray-200 focus:outline-none focus:ring-1 focus:ring-accent/50" name="agentic_semantic_judge_criteria" value="{{ agentic.semantic_judge.criteria|join:', ' }}" placeholder="{% for d in dims %}{{ d.name }}{% if not forloop.last %}, {% endif %}{% endfor %}" title="{% for d in dims %}{{ d.name }}: {{ d.description }}&#10;{% endfor %}">
    </div>
  </div>
  {% endwith %}
</fieldset>
