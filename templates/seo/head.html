{# Reusable SEO head partial. Pass: seo_title, seo_description, seo_robots, seo_og_type, seo_jsonld (list of JSON strings), og_image_url. Canonical/og:url derive from the live request. #}
<meta name="description" content="{{ seo_description|default:'SimpleAudit Studio is a self-hostable platform for running reproducible AI model audits. Freeze inputs, compare runs, and judge LLM behavior with the SimpleAudit Target → Auditor → Judge engine.' }}">
<meta name="robots" content="{{ seo_robots|default:'index,follow' }}">
<link rel="canonical" href="{{ request.build_absolute_uri }}">
<meta name="theme-color" content="#0f1117">

{# Open Graph #}
<meta property="og:site_name" content="SimpleAudit Studio">
<meta property="og:type" content="{{ seo_og_type|default:'website' }}">
<meta property="og:title" content="{{ seo_title|default:'SimpleAudit Studio — Reproducible AI Model Auditing Platform' }}">
<meta property="og:description" content="{{ seo_description|default:'SimpleAudit Studio is a self-hostable platform for running reproducible AI model audits.' }}">
<meta property="og:url" content="{{ request.build_absolute_uri }}">
<meta property="og:image" content="{{ og_image_url }}">

{# Twitter Card #}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo_title|default:'SimpleAudit Studio — Reproducible AI Model Auditing Platform' }}">
<meta name="twitter:description" content="{{ seo_description|default:'SimpleAudit Studio is a self-hostable platform for running reproducible AI model audits.' }}">
<meta name="twitter:image" content="{{ og_image_url }}">

{# Structured data (JSON-LD) #}
{% for schema in seo_jsonld %}
<script type="application/ld+json">{{ schema|safe }}</script>
{% endfor %}
