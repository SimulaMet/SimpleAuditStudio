{% extends "base.html" %}
{% block title %}Register — SimpleAudit Studio{% endblock %}
{% block auth_content %}
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      {% load static %}
      <img src="{% static 'logo.png' %}" alt="SimpleAudit" class="w-16 h-16 rounded-xl mx-auto mb-3">
      <h1 class="text-2xl font-bold text-gray-100">SimpleAudit Studio</h1>
      <p class="text-sm text-gray-500 mt-1">Create account</p>
    </div>
    <form method="post" class="bg-surface-raised rounded-xl border border-gray-800 p-5 space-y-4">
      {% csrf_token %}
      {% if error %}
        <div class="text-xs text-red-400 bg-red-900/30 rounded-lg px-3 py-2">{{ error }}</div>
      {% endif %}
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1 uppercase tracking-wide">Username</label>
        <input type="text" name="username" required
               class="w-full px-3 py-2 rounded-lg bg-surface-overlay border border-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-accent/50"
               placeholder="your-name">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1 uppercase tracking-wide">Password</label>
        <input type="password" name="password" required autocomplete="new-password"
               class="w-full px-3 py-2 rounded-lg bg-surface-overlay border border-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-accent/50"
               placeholder="••••••••">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1 uppercase tracking-wide">Email (optional)</label>
        <input type="email" name="email"
               class="w-full px-3 py-2 rounded-lg bg-surface-overlay border border-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-accent/50"
               placeholder="you@example.com">
      </div>
      <button type="submit" class="w-full px-3 py-2 rounded-lg bg-accent text-white text-sm font-medium hover:bg-accent-hover transition-colors">
        Register
      </button>
    </form>
    <p class="text-center text-xs text-gray-600 mt-4">
      Have an account? <a href="{% url 'login' %}" class="text-accent hover:underline">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
