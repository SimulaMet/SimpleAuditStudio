; =============================================================================
; SimpleAudit Studio — HF Space supervisord configuration
;
; Process startup order (by priority):
;   10: postgres       — must be ready before anything else
;   20: hatchet-server — needs Postgres (hatchet DB)
;   30: worker         — needs Hatchet server + domain DB migrations
;   40: web            — needs domain DB migrations + bootstrap
;
; The start.sh script handles ordered initialization (initdb, createuser,
; createdb, migrate, bootstrap) BEFORE supervisord takes over. Supervisord
; only manages the long-running processes from that point on.
; =============================================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

; --- PostgreSQL ---------------------------------------------------------------
; Runs as appuser (supervisord's user) but delegates to postgres via sudo.
; The sudoers rule grants passwordless access to all postgres commands.
[program:postgres]
; $(shell ...) is evaluated at image build time, so this always matches the
; installed major version (same value start.sh computes dynamically).
command=sudo -u postgres /usr/lib/postgresql/$(shell ls /usr/lib/postgresql/ | head -1)/bin/postgres -D /var/lib/postgresql/data -c listen_addresses=localhost -c port=5432 -c unix_socket_directories=/tmp
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PGDATA="/var/lib/postgresql/data"

; --- Hatchet Server ------------------------------------------------------------
; Runs the Go binary extracted from the hatchet-lite-dev image.
; Connects to local Postgres for its own 'hatchet' database.
[program:hatchet-server]
command=/usr/local/bin/hatchet-lite --config /app/hatchet-config
directory=/app
autostart=true
autorestart=true
priority=20
startretries=10
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=
    DATABASE_URL="postgresql://simpleaudit:simpleaudit_hf_demo@localhost:5432/hatchet?sslmode=disable",
    LITE_STATIC_ASSET_DIR="/static-assets",
    LITE_FRONTEND_PORT="8081",
    LITE_FRONTEND_BASE_PATH="/",
    LITE_RUNTIME_PORT="8888",
    SERVER_AUTH_COOKIE_DOMAIN="localhost",
    SERVER_AUTH_COOKIE_INSECURE="t",
    SERVER_AUTH_SET_EMAIL_VERIFIED="t",
    SERVER_GRPC_BIND_ADDRESS="0.0.0.0",
    SERVER_GRPC_INSECURE="t",
    SERVER_GRPC_BROADCAST_ADDRESS="localhost:7077",
    SERVER_GRPC_PORT="7077",
    SERVER_HTTP_PORT="8888",
    SERVER_URL="http://localhost:8888",
    SERVER_LOG_LEVEL="info",
    SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS="localhost:7077"

; --- SimpleAudit Worker ---------------------------------------------------------
; Python process that connects to Hatchet and executes audit tasks.
[program:worker]
command=python manage.py run_worker --pool cpu
directory=/app
user=appuser
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=
    POSTGRES_HOST="localhost",
    HATCHET_SERVER_URL="http://localhost:8888",
    HATCHET_GRPC_URL="localhost:7077",
    HATCHET_TOKEN_FILE="/app/hatchet-config/authdisabled-token",
    WORKER_POOL="cpu",
    DJANGO_SETTINGS_MODULE="config.settings"

; --- Django Web (Gunicorn) -------------------------------------------------------
; Serves the SPA + API on port 7860 (HF Space app_port).
[program:web]
command=gunicorn config.wsgi:application --bind 0.0.0.0:7860 --workers 2 --timeout 120
directory=/app
user=appuser
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=
    POSTGRES_HOST="localhost",
    HATCHET_SERVER_URL="http://localhost:8888",
    HATCHET_GRPC_URL="localhost:7077",
    HATCHET_TOKEN_FILE="/app/hatchet-config/authdisabled-token",
    DJANGO_SETTINGS_MODULE="config.settings"
